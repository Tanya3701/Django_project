{% extends 'base.html' %}
{% load my_tags %}
{% block content %}
<div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3">

        <div class="col">
          <div class="card shadow-sm">
            <img src="{{ product.image | media_filter }} " class="img-fluid" alt={{product.name}} >
            <div class="card-body">
                <p class="text-success">Название: <strong class="text-dark">{{product.product_name}}</strong></p>
              <p class="text-success">Описание: <strong class="text-dark">{{product.description | truncatechars:100 }}</strong></p>
              <p class="text-success">Цена: <strong class="text-dark">{{product.price}}</strong></p>
              <p class="text-success">Дата создания: <strong class="text-dark">{{product.created_at | date:"d M Y"}}</strong></p>
              <div class="d-flex justify-content-between align-items-center">
              <a class="btn btn-secondary" href="{% url 'catalog:home' %}" role="button">На главную</a>
              </div>
                <p class="text-body-secondary">Категория: {{product.category}}</p>
            </div>
          </div>
        </div>

    </div>
{% endblock %}
