{% extends 'base.html' %}
{% load my_tags %}
{% block content %}
<div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3">
        {% for product in products%}
        <div class="col">
          <div class="card shadow-sm h-100" >
          <img src="{{ product.image | media_filter }} " class="img-fluid" alt={{product.name}} >
            <div class="card-body" >
              <p class="text-center">{{product.product_name}}</p>
              <div class="d-flex justify-content-between align-items-center">
              <div class="card-footer">
              <a class="btn btn-warning" href="{% url 'catalog:product_info' product.pk %}" role="button">Подробнее</a>
                <p class="text-body-secondary">Категория: {{product.category}}</p>
              </div>
              </div>
            </div>
          </div>
        </div>
        {% endfor %}
    </div>
{% endblock %}
