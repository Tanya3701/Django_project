{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="row">
    <div class="col-9">
    </div>
    <div class="col-3">
        <a class="btn btn-outline-success" href="{% url 'catalog:product_create' %}" role="button">+ Добавить товар</a>
    </div>
    <div class="row mb-3" >
    </div>
</div>
<div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3">
        {% for product in object_list %}
        <div class="col">
          <div class="card shadow-sm h-100" >
          <img src="{{ product.image | media_filter }} " class="img-fluid" alt={{product.name}} >
            <div class="card-body" >
              <p class="text-center">{{product.product_name}}</p>
              <div class="d-flex justify-content-between align-items-center">
              <div class="card-footer">
              <a class="btn btn-warning" href="{% url 'catalog:product_detail' product.pk %}" role="button">Подробнее</a>
              <a class="btn btn-outline-warning" href="{% url 'catalog:product_update' product.pk %}" role="button">Редактировать</a>
              <a class="btn btn-danger" href="{% url 'catalog:product_delete' product.pk %}" role="button">Удалить</a>
                <p class="text-body-secondary">Категория: {{product.category}}</p>
              </div>
              </div>
            </div>
          </div>
        </div>
        {% endfor %}
    </div>
{% endblock %}
