<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-secondary  border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">DivanЫ</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-light" href="{% url 'catalog:product_list' %}">Главная</a>
        <a class="p-2 btn btn-outline-light" href="{% url 'catalog:contacts' %}">Контакты</a>
        <a class="p-2 btn btn-outline-light" href="{% url 'blogs:blog_list' %}">Страница блогов</a>
        <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Товары по категориям</button>
            <ul class="dropdown-menu">
                {% for category in categories %}
                <li><a class="dropdown-item" href="{% url 'catalog:product_by_categories' category.id %}">{{category.category_name}}</a></li>
                    {% endfor %}
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="{% url 'catalog:product_list' %}">Все товары</a></li>
            </ul>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    </nav>
</div>
<div class="d-grid gap-2 d-md-flex justify-content-md-end">
    {% if user.is_authenticated %}
  <a class="p-2 btn btn-outline-dark" href="{% url 'users:logout' %}">Выход</a>
    {% else %}
  <a class="p-2 btn btn-outline-dark" href="{% url 'users:login' %}">Войти</a>
  <a class="p-2 btn btn-outline-dark" href="{% url 'users:register' %}">Регистрация</a>
    {% endif %}
</div>
