{% extends 'catalog/base.html' %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-5">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p}}
                    </div>
                    <button type="submit" class="btn btn-primary">
                    {% if object %}
                    Сохранить изменения
                    {% else %}
                    Создать
                    {% endif %}
                    </button>
                    <a class="btn btn-secondary" href="{% url 'blogs:blog_list' %}" role="button">Вернуться к МебельБлогам</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
